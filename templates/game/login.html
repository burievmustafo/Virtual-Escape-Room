<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Kirish - Jumboq O'yini</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .lang-dropdown {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
            position: relative;
        }

        .lang-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(6px);
        }

        .lang-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .lang-icon {
            font-size: 16px;
        }

        .lang-caret {
            font-size: 12px;
            opacity: 0.9;
        }

        .lang-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            min-width: 170px;
            padding: 6px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: all 0.2s ease;
            z-index: 10;
        }

        .lang-dropdown.active .lang-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .lang-item {
            width: 100%;
            border: none;
            background: transparent;
            padding: 10px 12px;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-item:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .lang-item.active {
            background: rgba(102, 126, 234, 0.15);
            font-weight: 600;
        }
        
        .login-header .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }
        
        .login-header h1 {
            color: #667eea;
            font-size: 28px;
            font-weight: 700;
        }
        
        .login-header p {
            color: #888;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }
        
        .login-footer p {
            color: #666;
            font-size: 14px;
        }
        
        .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="lang-dropdown" id="langDropdown">
            <button class="lang-toggle" type="button" onclick="toggleLangMenu()">
                <span class="lang-icon">🌐</span>
                <span class="lang-label" id="currentLangLabel">O'zbek</span>
                <span class="lang-caret">▾</span>
            </button>
            <div class="lang-menu">
                <button class="lang-item" data-lang="uz" onclick="setLanguage('uz')">🇺🇿 O'zbek</button>
                <button class="lang-item" data-lang="en" onclick="setLanguage('en')">🇬🇧 English</button>
                <button class="lang-item" data-lang="ja" onclick="setLanguage('ja')">🇯🇵 日本語</button>
            </div>
        </div>

        <div class="login-card">
            <div class="login-header">
                <div class="logo">🧩</div>
                <h1 data-translate="app_title">Jumboq O'yini</h1>
                <p data-translate="login_subtitle">Hisobingizga kiring</p>
            </div>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="error-message">{{ message }}</div>
                {% endfor %}
            {% endif %}
            
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username" data-translate="username">Foydalanuvchi nomi</label>
                    <input type="text" id="username" name="username" data-placeholder-translate="username_ph" placeholder="Username kiriting" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password" data-translate="password">Parol</label>
                    <input type="password" id="password" name="password" data-placeholder-translate="password_ph" placeholder="Parol kiriting" required>
                </div>
                
                <button type="submit" class="btn-login" data-translate="login_btn">Kirish</button>
            </form>
            
            <div class="login-footer">
                <p><span data-translate="no_account">Hisobingiz yo'qmi?</span> <a href="{% url 'register' %}" data-translate="register">Ro'yxatdan o'ting</a></p>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            uz: {
                app_title: "Jumboq O'yini",
                login_subtitle: "Hisobingizga kiring",
                username: "Foydalanuvchi nomi",
                password: "Parol",
                login_btn: "Kirish",
                no_account: "Hisobingiz yo'qmi?",
                register: "Ro'yxatdan o'ting",
                username_ph: "Username kiriting",
                password_ph: "Parol kiriting"
            },
            en: {
                app_title: "Puzzle Game",
                login_subtitle: "Sign in to your account",
                username: "Username",
                password: "Password",
                login_btn: "Login",
                no_account: "Don't have an account?",
                register: "Register",
                username_ph: "Enter your username",
                password_ph: "Enter your password"
            },
            ja: {
                app_title: "パズルゲーム",
                login_subtitle: "アカウントにログイン",
                username: "ユーザー名",
                password: "パスワード",
                login_btn: "ログイン",
                no_account: "アカウントをお持ちでないですか？",
                register: "登録",
                username_ph: "ユーザー名を入力",
                password_ph: "パスワードを入力"
            }
        };

        function setLanguage(lang, save = true) {
            const elements = document.querySelectorAll('[data-translate]');
            const placeholders = document.querySelectorAll('[data-placeholder-translate]');
            const langItems = document.querySelectorAll('.lang-item');
            const currentLabel = document.getElementById('currentLangLabel');
            const labels = {
                uz: "O'zbek",
                en: "English",
                ja: "日本語"
            };

            elements.forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            placeholders.forEach(el => {
                const key = el.getAttribute('data-placeholder-translate');
                if (translations[lang] && translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });

            langItems.forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-lang') === lang) {
                    btn.classList.add('active');
                }
            });

            if (currentLabel && labels[lang]) {
                currentLabel.textContent = labels[lang];
            }

            if (save) {
                localStorage.setItem('language', lang);
                const csrf = document.querySelector('meta[name="csrf-token"]')?.content;
                if (csrf) {
                    fetch('/set-language/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrf
                        },
                        body: JSON.stringify({ language: lang })
                    }).catch(() => {});
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const savedLang = localStorage.getItem('language') || 'uz';
            setLanguage(savedLang, false);
        });

        function toggleLangMenu() {
            document.getElementById('langDropdown').classList.toggle('active');
        }

        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('langDropdown');
            if (dropdown && !dropdown.contains(event.target)) {
                dropdown.classList.remove('active');
            }
        });
    </script>
</body>
</html>
