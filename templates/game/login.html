<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Kirish - Jumboq O'yini</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .lang-btn {
            padding: 6px 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #f8f9fa;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .login-header .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }
        
        .login-header h1 {
            color: #667eea;
            font-size: 28px;
            font-weight: 700;
        }
        
        .login-header p {
            color: #888;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }
        
        .login-footer p {
            color: #666;
            font-size: 14px;
        }
        
        .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="lang-switcher">
                    <button class="lang-btn active" data-lang="uz" onclick="setLanguage('uz')">🇺🇿</button>
                    <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">🇬🇧</button>
                    <button class="lang-btn" data-lang="ja" onclick="setLanguage('ja')">🇯🇵</button>
                </div>
                <div class="logo">🧩</div>
                <h1 data-translate="app_title">Jumboq O'yini</h1>
                <p data-translate="login_subtitle">Hisobingizga kiring</p>
            </div>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="error-message">{{ message }}</div>
                {% endfor %}
            {% endif %}
            
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username" data-translate="username">Foydalanuvchi nomi</label>
                    <input type="text" id="username" name="username" data-placeholder-translate="username_ph" placeholder="Username kiriting" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password" data-translate="password">Parol</label>
                    <input type="password" id="password" name="password" data-placeholder-translate="password_ph" placeholder="Parol kiriting" required>
                </div>
                
                <button type="submit" class="btn-login" data-translate="login_btn">Kirish</button>
            </form>
            
            <div class="login-footer">
                <p><span data-translate="no_account">Hisobingiz yo'qmi?</span> <a href="{% url 'register' %}" data-translate="register">Ro'yxatdan o'ting</a></p>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            uz: {
                app_title: "Jumboq O'yini",
                login_subtitle: "Hisobingizga kiring",
                username: "Foydalanuvchi nomi",
                password: "Parol",
                login_btn: "Kirish",
                no_account: "Hisobingiz yo'qmi?",
                register: "Ro'yxatdan o'ting",
                username_ph: "Username kiriting",
                password_ph: "Parol kiriting"
            },
            en: {
                app_title: "Puzzle Game",
                login_subtitle: "Sign in to your account",
                username: "Username",
                password: "Password",
                login_btn: "Login",
                no_account: "Don't have an account?",
                register: "Register",
                username_ph: "Enter your username",
                password_ph: "Enter your password"
            },
            ja: {
                app_title: "パズルゲーム",
                login_subtitle: "アカウントにログイン",
                username: "ユーザー名",
                password: "パスワード",
                login_btn: "ログイン",
                no_account: "アカウントをお持ちでないですか？",
                register: "登録",
                username_ph: "ユーザー名を入力",
                password_ph: "パスワードを入力"
            }
        };

        function setLanguage(lang, save = true) {
            const elements = document.querySelectorAll('[data-translate]');
            const placeholders = document.querySelectorAll('[data-placeholder-translate]');
            const langBtns = document.querySelectorAll('.lang-btn');

            elements.forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            placeholders.forEach(el => {
                const key = el.getAttribute('data-placeholder-translate');
                if (translations[lang] && translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });

            langBtns.forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-lang') === lang) {
                    btn.classList.add('active');
                }
            });

            if (save) {
                localStorage.setItem('language', lang);
                const csrf = document.querySelector('meta[name="csrf-token"]')?.content;
                if (csrf) {
                    fetch('/set-language/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrf
                        },
                        body: JSON.stringify({ language: lang })
                    }).catch(() => {});
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const savedLang = localStorage.getItem('language') || 'uz';
            setLanguage(savedLang, false);
        });
    </script>
</body>
</html>
